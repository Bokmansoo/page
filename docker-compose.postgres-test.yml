services:
  postgres-test:
    image: postgres:17-alpine
    container_name: sellform-postgres-test
    environment:
      POSTGRES_DB: sellform_test
      POSTGRES_USER: sellform_test
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sellform_test -d sellform_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
