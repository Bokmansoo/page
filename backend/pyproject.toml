[project]
name = "sellform-backend"
version = "0.1.0"
description = "Sellform FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "psycopg2-binary>=2.9.9",
    # LangGraph's synchronous PostgreSQL checkpointer uses psycopg 3. The
    # binary extra supplies libpq on Windows/local development as well.
    "psycopg[binary]>=3.2.0,<4.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "redis>=5.0.3",
    "openai>=1.14.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.4.0",
    "playwright>=1.42.0",
    "pillow>=10.2.0",
    "pytesseract>=0.3.13",
    # LG-0: actual graph runtime. New runs remain on the legacy path until
    # the LangGraph migration feature flag is enabled in later sprints.
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0,<4.0.0",
    # Google OIDC callback signature / issuer / audience verification.
    "PyJWT[crypto]>=2.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "responses>=0.26.2",
]

[tool.pytest.ini_options]
# The cache is optional and can otherwise retain files owned by a different
# Windows account when the workspace is shared.
addopts = "-p no:cacheprovider"
markers = [
    "lg9_fake_e2e: zero-cost production LangGraph LG-9 image workflow integration coverage",
    "lg9_real_provider_smoke: opt-in smoke test that sends an image request to the configured real provider",
    "lg10_fake_e2e: zero-cost production LangGraph LG-10 assembly, render, and export quality gate",
    "lg10_real_provider_smoke: opt-in smoke that carries one real-provider image through the LG-10 final snapshot",
    "lg11_fake_e2e: zero-cost production LangGraph LG-11 edit, Canvas, restore, and export quality gate",
    "lg11_real_provider_smoke: opt-in smoke for an LG-11 scene edit through the configured real provider",
    "lg12i_fake_e2e: zero-cost production LangGraph LG-12I unified intake routing coverage",
]
